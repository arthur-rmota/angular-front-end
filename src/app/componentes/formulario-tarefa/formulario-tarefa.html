<form class="formulario" [formGroup]="form" (ngSubmit)="enviar()">
  <div class="campo">
    <label for="titulo">Título <span aria-hidden="true">*</span></label>
    <input id="titulo" formControlName="titulo"
      [attr.aria-invalid]="erro('titulo') ? 'true' : null"
      [attr.aria-describedby]="erro('titulo') ? 'erro-titulo' : null" />
    @if (erro('titulo')) { <p class="erro" id="erro-titulo" role="alert">⚠ {{ erro('titulo') }}</p> }
  </div>

  <div class="campo">
    <label for="descricao">Descrição</label>
    <textarea id="descricao" formControlName="descricao" rows="3"></textarea>
  </div>

  <div class="campo">
    <label for="projetoId">Projeto <span aria-hidden="true">*</span></label>
    <select id="projetoId" formControlName="projetoId"
      [attr.aria-invalid]="erro('projetoId') ? 'true' : null"
      [attr.aria-describedby]="erro('projetoId') ? 'erro-projeto' : null">
      <option value="" disabled>Escolha um projeto</option>
      @for (projeto of projetos.value(); track projeto.id) {
        <option [value]="projeto.id">{{ projeto.nome }}</option>
      }
    </select>
    @if (erro('projetoId')) { <p class="erro" id="erro-projeto" role="alert">⚠ {{ erro('projetoId') }}</p> }
  </div>

  <div class="linha">
    <div class="campo">
      <label for="status">Status</label>
      <select id="status" formControlName="status">
        @for (s of status; track s[0]) {
          <option [value]="s[0]">{{ s[1] }}</option>
        }
      </select>
    </div>

    <div class="campo">
      <label for="prioridade">Prioridade</label>
      <select id="prioridade" formControlName="prioridade">
        @for (p of prioridades; track p[0]) {
          <option [value]="p[0]">{{ p[1] }}</option>
        }
      </select>
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="responsavel">Responsável <span aria-hidden="true">*</span></label>
      <input id="responsavel" formControlName="responsavel"
        [attr.aria-invalid]="erro('responsavel') ? 'true' : null"
        [attr.aria-describedby]="erro('responsavel') ? 'erro-responsavel' : null" />
      @if (erro('responsavel')) { <p class="erro" id="erro-responsavel" role="alert">⚠ {{ erro('responsavel') }}</p> }
    </div>

    <div class="campo">
      <label for="prazo">Prazo <span aria-hidden="true">*</span></label>
      <input id="prazo" type="date" formControlName="prazo"
        [attr.aria-invalid]="erro('prazo') ? 'true' : null"
        [attr.aria-describedby]="erro('prazo') ? 'erro-prazo' : null" />
      @if (erro('prazo')) { <p class="erro" id="erro-prazo" role="alert">⚠ {{ erro('prazo') }}</p> }
    </div>
  </div>

  <p class="legenda"><span aria-hidden="true">*</span> campo obrigatório</p>

  <button type="submit" [disabled]="salvando()">
    {{ salvando() ? 'Salvando...' : textoBotao() }}
  </button>
</form>
