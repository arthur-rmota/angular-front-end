<article class="cartao">
  <span class="barra-lateral" aria-hidden="true"></span>

  <img class="icone-docinho" src="docinho.webp" alt="" aria-hidden="true" />

  <div class="cartao-conteudo">
    <h3>
      <a [routerLink]="['/tarefas', tarefa().id]">
        {{ tarefa().titulo }}
      </a>
    </h3>

    <div class="etiquetas">
      <span class="status status-{{ tarefa().status }}">
        {{ rotuloStatus[tarefa().status] }}
      </span>

      <span class="prioridade prioridade-{{ tarefa().prioridade }}">
        Prioridade {{ rotuloPrioridade[tarefa().prioridade] }}
      </span>
    </div>

    <p class="info">
      <span class="responsavel">
        <span class="icone-info" aria-hidden="true">👤</span>
        {{ tarefa().responsavel }}
      </span>

      <span class="prazo">
        <span class="icone-info" aria-hidden="true">🗓️</span>
        {{ formatarData(tarefa().prazo) }}
      </span>
    </p>

    <div class="acoes">
      <a [routerLink]="['/tarefas', tarefa().id, 'editar']" class="botao-tarefa">Editar tarefa</a>
      <button type="button" class="botao-excluir" (click)="excluir()" [disabled]="excluindo()">
        {{ excluindo() ? 'Excluindo...' : 'Excluir' }}
      </button>

      @if (erroExclusao()) {
        <p class="erro-exclusao" role="alert">⚠ {{ erroExclusao() }}</p>
      }
    </div>
  </div>
</article>
