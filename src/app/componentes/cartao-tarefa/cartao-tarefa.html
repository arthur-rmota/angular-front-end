<article class="cartao">
  <h3><a [routerLink]="['/tarefas', tarefa().id]">{{ tarefa().titulo }}</a></h3>
  <div class="etiquetas">
    <span class="status status-{{ tarefa().status }}">{{ rotuloStatus[tarefa().status] }}</span>
    <span class="prioridade prioridade-{{ tarefa().prioridade }}">Prioridade {{ rotuloPrioridade[tarefa().prioridade] }}</span>
  </div>
  <p class="info">
    <span>👤 {{ tarefa().responsavel }}</span>
    <span>📅 {{ formatarData(tarefa().prazo) }}</span>
  </p>
</article>
